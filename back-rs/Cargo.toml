[package]
name = "refleja-api"
version = "1.0.0"
edition = "2021"
description = "Backend de Refleja (reescritura en Rust del API FastAPI)"
publish = false

[lib]
name = "refleja_api"
path = "src/lib.rs"

[[bin]]
name = "refleja-api"
path = "src/main.rs"

[[bin]]
name = "refleja-admin"
path = "src/bin/refleja-admin.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
argon2 = { version = "0.5", features = ["std"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lru = "0.18"
form_urlencoded = "1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
